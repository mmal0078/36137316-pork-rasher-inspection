[project]
name = "porkinspect"
version = "0.4.0"
description = "Defect detection for packaged pork rashers (MMA3001 project)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10", "matplotlib>=3.7", "scikit-learn>=1.3", "scikit-image>=0.21"]

[project.optional-dependencies]
train = ["ultralytics>=8.3"]
dev = ["pytest>=8", "pytest-html>=4", "pdoc>=14"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
